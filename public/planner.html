<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget — Paycheck Planner</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .board-scroll { overflow-x: auto; padding-bottom: 20px; }
    .planner-board { display: flex; gap: 24px; min-width: max-content; }
    .planner-col { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 340px; display: flex; flex-direction: column; max-height: calc(100vh - 140px); }
    .planner-col-header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .col-date { font-size: 13px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .col-amount { font-size: 26px; font-weight: 800; color: var(--green); }
    .planner-col-body { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .planner-group-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .planner-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .planner-item-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .planner-item-amount { font-size: 15px; font-weight: 700; }
    .planner-item-amount.negative { color: var(--red); }
    .planner-col-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--bg-card); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .net-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    .net-amount { font-size: 24px; font-weight: 800; }
    .net-positive { color: var(--green); }
    .net-negative { color: var(--red); }
    .planner-col.extra-check { border-color: rgba(168,85,247,0.4); background: linear-gradient(180deg, rgba(168,85,247,0.05), transparent 40%); }
    .planner-item.draggable { cursor: grab; user-select: none; transition: transform 0.15s ease, border-color 0.15s ease; }
    .planner-item.draggable:hover { border-color: var(--accent); transform: translateX(2px); }
    .planner-item.dragging { opacity: 0.4; cursor: grabbing; }
    .planner-item.paid { opacity: 0.55; text-decoration: line-through; }
    .planner-col.drag-over { background: rgba(99,102,241,0.08); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .drag-handle { color: var(--text-muted); font-size: 12px; letter-spacing: -2px; cursor: grab; }
</style>
</head>
<body>
<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">💎</div><div><div class="logo-text">BudgetOS</div><div class="logo-sub">Personal Finance</div></div></div>
    <span class="nav-section-label">Overview</span>
    <a href="/index.html" class="nav-item" data-page="index.html"><span class="nav-icon">📊</span><span>Dashboard</span></a>
    <a href="/calendar.html" class="nav-item" data-page="calendar.html"><span class="nav-icon">📅</span><span>Calendar</span></a>
    <span class="nav-section-label">Money</span>
    <a href="/paychecks.html" class="nav-item" data-page="paychecks.html"><span class="nav-icon">💰</span><span>Paychecks</span></a>
    <a href="/bills.html" class="nav-item" data-page="bills.html"><span class="nav-icon">🧾</span><span>Bills</span></a>
    <span class="nav-section-label">Planning</span>
    <a href="/planner.html" class="nav-item active" data-page="planner.html"><span class="nav-icon">📋</span><span>Planner</span></a>
    <a href="/events.html" class="nav-item" data-page="events.html"><span class="nav-icon">🎉</span><span>Events</span></a>
    <a href="/savings.html" class="nav-item" data-page="savings.html"><span class="nav-icon">🏦</span><span>Savings</span></a>
    <div class="sidebar-footer">BudgetOS v1.0</div>
  </nav>

  <main class="main-content">
    <div class="page-header" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
      <div>
        <h1>📋 Paycheck Planner</h1>
        <p>Drag bills between paychecks · 3rd-check bonuses auto-flagged</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" id="auto-allocate-all-btn">⚡ Auto-Allocate All</button>
        <button class="btn btn-secondary" onclick="loadPlanner()">↻ Refresh</button>
      </div>
    </div>

    <div class="board-scroll">
      <div class="planner-board" id="planner-board">
        <div style="color:var(--text-muted);padding:20px">Loading planner...</div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/planner.js"></script>
</body>
</html>
